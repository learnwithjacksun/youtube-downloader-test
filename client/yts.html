<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>YouTube search · Stream saver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  </head>
  <body data-platform="yts" class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased">
    <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(244,63,94,0.12),_transparent_55%)]"></div>
    <div id="site-header" class="relative"></div>
    <main class="relative mx-auto max-w-7xl px-4 py-8 sm:py-10">
      <p class="mb-3 text-sm font-medium uppercase tracking-[0.2em] text-rose-400">Stream saver</p>
      <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">YouTube search</h1>
      <p class="mt-3 max-w-2xl text-zinc-400">Search YouTube, browse results in a grid, stream a video, then download it.</p>

      <form id="search-form" class="mt-8 max-w-3xl">
        <label for="q" class="sr-only">Search YouTube</label>
        <div class="flex overflow-hidden rounded-full border border-zinc-700 bg-zinc-900 focus-within:border-rose-500 focus-within:ring-2 focus-within:ring-rose-500/40">
          <input
            id="q"
            name="q"
            type="search"
            required
            autocomplete="off"
            placeholder="Search"
            class="w-full bg-transparent px-5 py-3 text-sm text-white outline-none placeholder:text-zinc-500"
          />
          <button
            id="search-button"
            type="submit"
            class="inline-flex shrink-0 items-center gap-2 border-l border-zinc-700 bg-zinc-800 px-5 py-3 text-sm font-semibold text-white transition hover:bg-zinc-700 disabled:cursor-not-allowed disabled:opacity-60"
          >
            <span class="material-symbols-outlined text-[20px]">search</span>
            Search
          </button>
        </div>
        <p id="error" class="mt-3 hidden text-sm text-rose-400"></p>
      </form>

      <p id="results-status" class="mt-8 hidden text-sm text-zinc-400"></p>
      <div id="results-grid" class="mt-4 grid grid-cols-1 gap-x-4 gap-y-8 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
    </main>

    <div id="watch-overlay" class="fixed inset-0 z-[60] hidden" role="dialog" aria-modal="true" aria-labelledby="watch-title">
      <button id="watch-backdrop" type="button" class="absolute inset-0 bg-black/80" aria-label="Close player"></button>
      <div class="relative mx-auto flex h-full max-w-5xl flex-col justify-center overflow-y-auto px-4 py-6">
        <div class="overflow-hidden rounded-2xl border border-zinc-800 bg-zinc-950 shadow-2xl shadow-black/60">
          <div id="watch-player" class="relative aspect-video bg-black"></div>
          <div class="space-y-4 p-4 sm:p-5">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <h2 id="watch-title" class="text-lg font-semibold text-white"></h2>
                <p id="watch-meta" class="mt-1 text-sm text-zinc-400"></p>
              </div>
              <button
                id="watch-close"
                type="button"
                class="inline-flex shrink-0 items-center justify-center rounded-full p-2 text-zinc-300 hover:bg-zinc-800 hover:text-white"
                aria-label="Close player"
              >
                <span class="material-symbols-outlined text-[22px]">close</span>
              </button>
            </div>
            <p id="watch-error" class="hidden text-sm text-rose-400"></p>
            <div class="flex flex-col gap-3 sm:flex-row">
              <select
                id="watch-format"
                class="w-full rounded-xl border border-zinc-700 bg-zinc-900 px-4 py-3 text-sm text-white outline-none ring-rose-500/40 focus:border-rose-500 focus:ring-2 sm:max-w-xs"
              ></select>
              <button
                id="watch-download"
                type="button"
                disabled
                class="inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-rose-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-rose-400 disabled:cursor-not-allowed disabled:opacity-60"
              >
                <span class="material-symbols-outlined text-[20px]">download</span>
                Download
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./script/nav.js"></script>
    <script src="./script/search.js"></script>
  </body>
</html>
