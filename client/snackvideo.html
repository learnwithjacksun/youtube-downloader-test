<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SnackVideo · Stream saver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet" />
  </head>
  <body data-platform="snackvideo" class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased">
    <div class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(244,63,94,0.12),_transparent_55%)]"></div>
    <div id="site-header" class="relative"></div>
    <main class="relative mx-auto max-w-2xl px-4 py-12 sm:py-16">
      <p class="mb-3 text-sm font-medium uppercase tracking-[0.2em] text-rose-400">Stream saver</p>
      <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">Download from SnackVideo</h1>
      <p class="mt-3 text-zinc-400">Preview a SnackVideo, then download.</p>
      <form id="preview-form" class="mt-8 rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 shadow-2xl shadow-black/40 backdrop-blur">
        <label for="url" class="mb-2 block text-sm font-medium text-zinc-300">SnackVideo URL</label>
        <div class="flex flex-col gap-3 sm:flex-row">
          <input id="url" name="url" type="text" required placeholder="https://s.snackvideo.com/p/..." class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white outline-none ring-rose-500/40 placeholder:text-zinc-500 focus:border-rose-500 focus:ring-2" />
          <button id="preview-button" type="submit" class="shrink-0 rounded-xl bg-rose-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:ring-offset-2 focus:ring-offset-zinc-900 disabled:cursor-not-allowed disabled:opacity-60">Preview</button>
        </div>
        <p id="error" class="mt-3 hidden text-sm text-rose-400"></p>
      </form>
      <article id="preview-card" class="mt-6 hidden overflow-hidden rounded-2xl border border-zinc-800 bg-zinc-900/70 shadow-2xl shadow-black/40 backdrop-blur">
        <div id="preview-media" class="aspect-video bg-zinc-950"></div>
        <div class="space-y-4 p-5">
          <div>
            <h2 id="video-title" class="text-lg font-semibold text-white"></h2>
            <p id="video-meta" class="mt-1 text-sm text-zinc-400"></p>
            <p id="platform-note" class="mt-2 hidden text-sm text-amber-300"></p>
          </div>
          <div>
            <label for="format" class="mb-2 block text-sm font-medium text-zinc-300">File format</label>
            <select id="format" class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white outline-none ring-rose-500/40 focus:border-rose-500 focus:ring-2"></select>
          </div>
          <button id="download-button" type="button" class="inline-flex w-full items-center justify-center gap-2 rounded-xl bg-rose-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:ring-offset-2 focus:ring-offset-zinc-900">
            <span class="material-symbols-outlined text-[20px]">download</span>
            Download
          </button>
        </div>
      </article>
    </main>
    <script src="./nav.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
