<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Download</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ["Inter", "ui-sans-serif", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-zinc-950 text-zinc-100 font-sans antialiased">
    <div
      class="pointer-events-none fixed inset-0 bg-[radial-gradient(ellipse_at_top,_rgba(244,63,94,0.12),_transparent_55%)]"
    ></div>

    <main class="relative flex min-h-screen items-center justify-center px-4 py-16">
      <section class="w-full max-w-xl">
        <p class="mb-3 text-sm font-medium uppercase tracking-[0.2em] text-rose-400">
          Stream saver
        </p>
        <h1 class="text-3xl font-semibold tracking-tight text-white sm:text-4xl">
          Download a YouTube video
        </h1>
        <p class="mt-3 text-zinc-400">
          Paste a watch URL and we’ll stream the file to your computer.
        </p>

        <form
          id="download-form"
          class="mt-8 rounded-2xl border border-zinc-800 bg-zinc-900/70 p-4 shadow-2xl shadow-black/40 backdrop-blur"
        >
          <label for="url" class="mb-2 block text-sm font-medium text-zinc-300">
            YouTube URL
          </label>
          <div class="flex flex-col gap-3 sm:flex-row">
            <input
              id="url"
              name="url"
              type="url"
              required
              placeholder="https://www.youtube.com/watch?v=..."
              class="w-full rounded-xl border border-zinc-700 bg-zinc-950 px-4 py-3 text-sm text-white outline-none ring-rose-500/40 placeholder:text-zinc-500 focus:border-rose-500 focus:ring-2"
            />
            <button
              type="submit"
              class="shrink-0 rounded-xl bg-rose-500 px-5 py-3 text-sm font-semibold text-white transition hover:bg-rose-400 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:ring-offset-2 focus:ring-offset-zinc-900"
            >
              Download
            </button>
          </div>
        </form>
      </section>
    </main>

    <script>
      const form = document.getElementById("download-form");

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const url = new FormData(form).get("url")?.toString().trim();
        if (!url) return;

        window.location.href = `http://localhost:3000/download?url=${encodeURIComponent(url)}`;
      });
    </script>
  </body>
</html>
